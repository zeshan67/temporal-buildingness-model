# Transport mode archetypes.
# City and country fields record where parameter evidence came from (provenance),
# not empirical claims about those cities.
# The per-mode `context` blocks are v1.0 only (used by legacy/reproduce_v1_0.py).
# From v1.1 they are NOT read: context is a shared experimental factor set in
# config/contexts.yaml and applied identically to every mode.

transport_modes:

  Rickshaw_Dhaka:
    display_name: "Rickshaw"
    city: "Dhaka"
    country: "Bangladesh"
    movement_family: "flexible_point_to_point"

    max_speed: 5.0
    slow_speed: 2.2
    capacity: 2

    threshold_duration_min: 2
    threshold_duration_max: 8

    anchor_preference: 0.78
    demand_sensitivity: 0.92
    curb_sensitivity: 0.95
    waiting_tendency: 0.72
    stop_flexibility: 0.95
    route_formality: 0.10
    terminal_dependence: 0.25

    enclosure_factor: 0.70
    edge_coupling_tendency: 0.90
    repair_delay_probability: 0.04

    context:
      pedestrian_intensity_multiplier: 1.40
      congestion_multiplier: 1.35
      curb_accessibility_multiplier: 0.90
      anchor_strength_multiplier: 1.20
      regulation_pressure: 0.40


