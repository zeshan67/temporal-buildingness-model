simulation:
  total_steps: 1000
  timestep_seconds: 10
  random_seed: 42

network:
  grid_width: 12
  grid_height: 12
  default_edge_length: 50

agents:
  informal_transport_count: 20
  conventional_vehicle_count: 20

informal_transport:
  max_speed: 6.0
  slow_speed: 2.5
  capacity: 2
  threshold_duration_min: 2
  threshold_duration_max: 8
  max_anchor_wait_time: 60
  demand_detection_radius: 2

conventional_vehicle:
  max_speed: 12.0
  stop_probability: 0.02